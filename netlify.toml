[build]
  base = "."
  publish = "apps/web/dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none';"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
